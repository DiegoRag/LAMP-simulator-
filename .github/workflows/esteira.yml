# Esteira mínima do lamp-sim (ADR-0010 — é esta a "esteira verde" da regra).
#
# Une as verificações das duas peças que agora vivem neste repositório
# (roadmap da esteira, 16/10/2026), e nenhuma delas fica de fora:
#   - do kit de governança: versões fixadas e nada de resultado versionado;
#   - da CI do lampsim (Henrique Prado): estilo (ruff) e testes;
#   - da LAMP-GIT-002, a esteira mínima desta frente: "gerar um conjunto
#     pequeno duas vezes com a mesma semente e comparar". Ela esperava o
#     gerador existir; com o lampsim aqui, passa a ter objeto e entra.
#
# Roda em pedido de integração, que é onde a verificação tem função: barrar o
# que não passa antes de entrar no ramo principal. A CI do lampsim rodava
# também a cada envio; aqui fica só no pedido, para poupar os minutos do plano
# gratuito (ADR-0010). Para rodar num ramo sem pedido: Actions → Run workflow.

name: Verificações

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificacoes:
    name: Verificações do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Convenção herdada da esteira do lamp-firmware, verificação 2. O
      # acompanhamento automático de dependências avisa quando uma versão fica
      # vulnerável; ele não tem o que avisar sobre uma linha que não declara
      # versão alguma.
      - name: Toda dependência tem versão fixada
        run: |
          set -euo pipefail
          sem_versao="$(grep -vE '^[[:space:]]*(#|$)' requirements.txt | grep -vE '==' || true)"
          if [ -n "$sem_versao" ]; then
            echo "::error::Dependência sem versão fixada em requirements.txt:"
            echo "$sem_versao"
            exit 1
          fi
          echo "Todas as dependências declaram versão fixada."

      # "Versione a receita, não o resultado" (LAMP-GIT-002). A lista de
      # exclusão evita o acidente comum; esta verificação apanha o incomum,
      # que é o que de fato acontece — um "git add -A" numa pasta com saída.
      - name: Nenhum resultado versionado
        run: |
          set -euo pipefail
          achados="$(git ls-files | grep -iE '\.(png|jpe?g|tiff?|bmp|npy|npz|parquet)$|^datasets/' || true)"
          if [ -n "$achados" ]; then
            echo "::error::Resultado versionado no lamp-sim. Entra a receita, não o resultado:"
            echo "$achados"
            exit 1
          fi
          echo "Nenhum resultado versionado."

  testes:
    name: Estilo, testes e determinismo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 é o piso: numpy 2.5.2 e scipy 1.18.1 não instalam em 3.11, que era
      # a versão da CI do lampsim antes da fusão.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências fixadas
        run: python -m pip install -r requirements.txt

      - name: Estilo
        run: ruff check .

      - name: Testes
        run: python -m pytest -q

      # A receita só substitui o resultado se gerar duas vezes com a mesma
      # semente der exatamente o mesmo resultado (LAMP-GIT-002). Dois processos
      # separados, para apanhar também o que muda de uma execução para outra e
      # um teste dentro de um processo só não vê.
      - name: Mesma semente, mesmo lote
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for i in 1 2; do
            python - > "lote_$i.txt" <<'PY'
          import hashlib

          from lampsim.classes import simular
          from lampsim.manifesto import gerar_lote, hash_lote

          lote = gerar_lote(5, 2026)
          resumo = hashlib.sha256()
          for amostra in lote:
              trajetoria = simular(amostra)
              for campo in ("t", "ph", "fracao_acida", "rgb"):
                  resumo.update(trajetoria[campo].tobytes())
          print(hash_lote(lote), resumo.hexdigest())
          PY
          done
          diff lote_1.txt lote_2.txt
          echo "Mesma semente, mesmo lote: $(cat lote_1.txt)"
