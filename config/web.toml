[sessoes]
# cada navegador tem a sua sessão, identificada por um cookie aleatório
cookie        = "lampsim_sessao"
validade_min  = 120     # sessão sem uso por mais que isso é descartada
max_sessoes   = 500     # acima disso, descarta a menos usada recentemente
cookie_seguro = false   # true só atrás de HTTPS
